<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L’Imposteur</title>
<style>
:root{--bg:#eef0fb;--card:#fff;--ink:#1d2340;--mute:#6a7091;--acc:#e0245e;--ok:#1f9d8a;--line:#d5d9f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a33;--card:#212749;--ink:#eef0fb;--mute:#9aa1cc;--line:#343c6b}}
:root[data-theme="dark"]{--bg:#161a33;--card:#212749;--ink:#eef0fb;--mute:#9aa1cc;--line:#343c6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:34px;margin:8px 0 4px;letter-spacing:-.5px}
h2{font-size:24px;margin:0 0 12px}
p{line-height:1.5;margin:6px 0}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 18px;background:var(--ink);color:var(--bg);width:100%;cursor:pointer;margin-top:10px}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.red{background:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=text]{font:inherit;width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0}
input.code{text-transform:uppercase;letter-spacing:8px;text-align:center;font-size:24px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
.step{display:flex;align-items:center;gap:12px}
.step button{width:42px;height:42px;padding:0;margin:0;font-size:20px}
.step b{min-width:24px;text-align:center;font-size:20px}
.word{font-size:40px;font-weight:800;text-align:center;margin:18px 0;word-break:break-word}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl.dead{opacity:.5}
.pl button{width:auto;margin:0;padding:8px 14px}
.tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--line);white-space:nowrap}
.tag.c{background:var(--ok);color:#fff}.tag.u,.tag.w{background:var(--acc);color:#fff}
.big{text-align:center;font-size:48px;margin:6px 0}
.err{color:var(--acc);font-weight:600;min-height:22px}
.room{font-size:34px;font-weight:800;letter-spacing:8px;text-align:center;margin:6px 0}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;font-size:22px;background:var(--line);flex:none;vertical-align:middle;margin-right:8px}
.av.xl{width:84px;height:84px;font-size:52px;margin:0 auto 8px;display:flex}
.avs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.avs button{width:44px;height:44px;padding:0;margin:0;font-size:24px;background:transparent;border:2px solid var(--line)}
.avs button.on{border-color:var(--acc)}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<main id="app"></main>
<script>
var PAIRS=[["Chat","Chien"],["Café","Thé"],["Pizza","Tarte flambée"],["Plage","Piscine"],["Guitare","Violon"],["Vélo","Trottinette"],["Pomme","Poire"],["Cinéma","Théâtre"],["Hôpital","Clinique"],["Facebook","Instagram"],["Football","Rugby"],["Chocolat","Caramel"],["Avion","Hélicoptère"],["Lunettes","Lentilles"],["Cuillère","Fourchette"],["Roi","Empereur"],["Dentiste","Médecin"],["Pâtes","Riz"],["Ski","Snowboard"],["Livre","Magazine"],["Mer","Océan"],["Tigre","Lion"],["Douche","Bain"],["Mariage","Pacs"],["Pull","Gilet"],["Vampire","Zombie"],["Netflix","YouTube"],["Burger","Kebab"],["Montre","Bracelet"],["Pirate","Corsaire"],["Harry Potter","Seigneur des anneaux"],["Sushi","Maki"],["Moto","Scooter"],["Bière","Cidre"],["Château","Palais"]];
var S={screen:"menu",n:5,nu:1,white:true,names:[],err:"",pseudo:"",code:"",busy:false};
var RM,O=null;
S.av="🕵️";S.photo="";
try{S.pseudo=localStorage.getItem("imp_pseudo")||"";S.av=localStorage.getItem("imp_av")||"🕵️";S.photo=localStorage.getItem("imp_photo")||""}catch(e){}
var app=document.getElementById("app");
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML.replace(/"/g,"&quot;")}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(t){return String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}
function lbl(r){return r=="c"?"Civil":r=="u"?"Undercover":"Mr White"}
function nm(i){return (S.names[i]&&S.names[i].trim())||("Joueur "+(i+1))}
function saveNames(){document.querySelectorAll("[data-n]").forEach(function(e){S.names[+e.dataset.n]=e.value})}
function savePs(){try{localStorage.setItem("imp_pseudo",S.pseudo);localStorage.setItem("imp_av",S.av);localStorage.setItem("imp_photo",S.photo)}catch(e){}}
function go(s){S.screen=s;render()}
function render(){app.innerHTML=({menu:rMenu,setup:rSetup,reveal:rReveal,play:rPlay,out:rOut,end:rEnd,o:rO})[S.screen]()}

/* ---------- Menu ---------- */
function rMenu(){
  var h='<h1>L’Imposteur</h1><p class="mute">Trouve qui n’a pas le même mot que les autres.</p><div class="card"><label for="ps"><b>Ton pseudo</b></label><input type="text" id="ps" maxlength="16" placeholder="Ton pseudo" value="'+esc(S.pseudo)+'" oninput="S.pseudo=this.value;savePs()">'+avPicker()+'</div>';
  if(RM===undefined)h+='<p class="mute">Connexion au mode en ligne…</p>';
  else if(RM)h+='<div class="card"><h2>En ligne</h2><button class="red" '+(S.busy?"disabled":"")+' onclick="enter(genCode(),true)">Créer une partie</button><p class="mute" style="margin-top:18px">Ou rejoins tes amis avec leur code :</p><input type="text" class="code" id="cd" maxlength="4" placeholder="CODE" aria-label="Code de la partie" value="'+esc(S.code)+'" oninput="S.code=this.value"><button '+(S.busy?"disabled":"")+' onclick="enter(norm(S.code),false)">Rejoindre</button></div>';
  else h+='<div class="card"><p class="mute">Le mode en ligne n’a pas pu se charger : vérifie ta connexion internet puis recharge la page.</p></div>';
  return h+'<p class="err">'+esc(S.err)+'</p><button class="alt" onclick="S.err=\'\';go(\'setup\')">Jouer sur un seul téléphone</button>'}

/* ---------- Un seul téléphone ---------- */
function rSetup(){
  var h='<h1>Un seul téléphone</h1><p class="mute">On se passe le téléphone : chacun découvre son mot en secret.</p><div class="card">';
  h+='<div class="row"><span>Joueurs</span><span class="step"><button class="alt" onclick="chg(\'n\',-1)" aria-label="Moins de joueurs">−</button><b>'+S.n+'</b><button class="alt" onclick="chg(\'n\',1)" aria-label="Plus de joueurs">+</button></span></div>';
  h+='<div class="row"><span>Undercovers</span><span class="step"><button class="alt" onclick="chg(\'nu\',-1)" aria-label="Moins d’undercovers">−</button><b>'+S.nu+'</b><button class="alt" onclick="chg(\'nu\',1)" aria-label="Plus d’undercovers">+</button></span></div>';
  h+='<div class="row"><label for="w">Ajouter Mr White</label><input type="checkbox" id="w" '+(S.white?"checked":"")+' onchange="saveNames();S.white=this.checked;render()"></div></div><div class="card"><h2>Les prénoms</h2>';
  for(var i=0;i<S.n;i++)h+='<input type="text" data-n="'+i+'" placeholder="Joueur '+(i+1)+'" value="'+esc(S.names[i]||"")+'" aria-label="Prénom du joueur '+(i+1)+'">';
  return h+'</div><p class="err">'+S.err+'</p><button class="red" onclick="start()">Lancer la partie</button><button class="alt" onclick="S.err=\'\';go(\'menu\')">Retour au menu</button>'}
function chg(k,d){saveNames();S[k]=Math.max(k=="n"?3:1,Math.min(k=="n"?12:4,S[k]+d));S.err="";render()}
function start(){
  saveNames();var imp=S.nu+(S.white?1:0);
  if(S.n-imp<=imp){S.err="Trop d’imposteurs : il faut plus de civils que d’imposteurs.";render();return}
  var pair=shuf(PAIRS)[0],sw=Math.random()<.5;
  S.cw=sw?pair[1]:pair[0];S.uw=sw?pair[0]:pair[1];
  var roles=[],i;for(i=0;i<S.n;i++)roles.push("c");
  for(i=0;i<S.nu;i++)roles[i]="u";if(S.white)roles[S.nu]="w";
  roles=shuf(roles);
  S.p=roles.map(function(r,i){return{name:nm(i),role:r,alive:true}});
  S.idx=0;S.shown=false;go("reveal")}
function rReveal(){
  var p=S.p[S.idx];
  if(!S.shown)return '<h2>Passe le téléphone à</h2><div class="word">'+esc(p.name)+'</div><p class="mute" style="text-align:center">Les autres ne regardent pas !</p><button onclick="S.shown=true;render()">Voir mon mot</button>';
  var w=p.role=="c"?S.cw:p.role=="u"?S.uw:null;
  return '<h2>'+esc(p.name)+', ton mot :</h2><div class="card">'+(w?'<div class="word">'+esc(w)+'</div>':'<div class="word">Aucun mot</div><p style="text-align:center">Tu es <b>Mr White</b>. Écoute bien les autres et bluffe.</p>')+'</div><input type="text" id="lc" maxlength="24" placeholder="Écris un mot qui se rapproche du tien" aria-label="Ton mot indice"><button onclick="nextReveal()">'+(S.idx<S.n-1?"Valider, au suivant":"Valider, on commence")+'</button>'}
function nextReveal(){var v=(document.getElementById("lc").value||"").trim();if(!v){document.getElementById("lc").focus();return}S.p[S.idx].clue=v.slice(0,24);S.shown=false;S.idx++;if(S.idx>=S.n){S.start=pickStart();S.round=1;go("play")}else render()}
function alive(){return S.p.filter(function(p){return p.alive})}
function pickStart(){return shuf(alive().filter(function(p){return p.role!="w"}))[0].name}
function rPlay(){
  var h='<h2>Tour '+S.round+'</h2><div class="card"><p>Chacun son tour, dites <b>un seul mot</b> pour décrire votre mot, sans être trop évident.</p><p><b>'+esc(S.start)+'</b> commence.</p></div><div class="card"><p class="mute">Après la discussion, votez : touche le joueur éliminé.</p>';
  S.p.forEach(function(p,i){h+='<div class="pl '+(p.alive?"":"dead")+'"><span>'+esc(p.name)+(p.clue?'<br><small class="mute">« '+esc(p.clue)+' »</small>':'')+'</span>'+(p.alive?'<button class="alt" onclick="elim('+i+')">Éliminer</button>':'<span class="tag '+p.role+'">'+lbl(p.role)+'</span>')+'</div>'});
  return h+'</div>'}
function elim(i){if(!confirm("Éliminer "+S.p[i].name+" ?"))return;S.p[i].alive=false;S.out=i;S.guessed=false;go("out")}
function rOut(){
  var p=S.p[S.out];
  var h='<h2>'+esc(p.name)+' est éliminé</h2><div class="card"><div class="big">'+(p.role=="c"?"🙂":p.role=="u"?"🕵️":"👻")+'</div><p style="text-align:center">C’était un <span class="tag '+p.role+'">'+lbl(p.role)+'</span></p>';
  if(p.role=="w"&&!S.guessed)h+='<p>Dernière chance ! Quel est le mot des civils ?</p><input type="text" id="g" aria-label="Mot des civils"><button class="red" onclick="guess()">Valider</button></div>';
  else h+='</div><button onclick="after()">Continuer</button>';
  return h}
function guess(){S.guessed=true;if(norm(document.getElementById("g").value)==norm(S.cw)){S.win="w";go("end")}else after()}
function after(){S.guessed=false;var a=alive(),c=a.filter(function(p){return p.role=="c"}).length,im=a.length-c;
  if(im==0){S.win="c";go("end")}else if(c<=im){S.win="i";go("end")}else{S.round++;S.start=pickStart();go("play")}}
function winTxt(w){return w=="c"?"Les civils gagnent !":w=="w"?"Mr White gagne !":"Les imposteurs gagnent !"}
function rEnd(){
  var h='<div class="big">'+(S.win=="c"?"🎉":"😈")+'</div><h1 style="text-align:center">'+winTxt(S.win)+'</h1><p class="mute" style="text-align:center">'+(S.win=="w"?"Il a deviné « "+esc(S.cw)+" ».":"")+'</p><div class="card"><p>Mot des civils : <b>'+esc(S.cw)+'</b></p><p>Mot de l’undercover : <b>'+esc(S.uw)+'</b></p>';
  S.p.forEach(function(p){h+='<div class="pl"><span>'+esc(p.name)+'</span><span class="tag '+p.role+'">'+lbl(p.role)+'</span></div>'});
  return h+'</div><button class="red" onclick="start()">Rejouer avec les mêmes joueurs</button><button class="alt" onclick="go(\'setup\')">Changer les réglages</button><button class="alt" onclick="go(\'menu\')">Menu</button>'}

/* ---------- En ligne : connexion directe entre navigateurs (PeerJS), un code suffit ---------- */
var PFX="imposteur-undercover-",PH={},H=null;
var AVS=["🕵️","🦊","🐼","🐸","🦄","👽","🤖","🐙","🦁","🐧","🥷","🧛"];
function avHtml(av,ph,cls){var c="av"+(cls?" "+cls:"");
  if(ph&&ph.length<5000&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(ph))return '<img class="'+c+'" alt="" src="'+ph+'">';
  return '<span class="'+c+'" aria-hidden="true">'+esc(String(av||"🙂").slice(0,8))+'</span>'}
function avPicker(){
  var h='<p style="margin:14px 0 4px"><b>Ton avatar</b></p><div style="text-align:center">'+avHtml(S.av,S.photo,"xl")+'</div><div class="avs">';
  AVS.forEach(function(e){h+='<button class="'+(!S.photo&&S.av==e?"on":"")+'" aria-label="Avatar '+e+'" onclick="S.av=\''+e+'\';S.photo=\'\';savePs();render()">'+e+'</button>'});
  h+='</div><input type="file" id="ph" accept="image/*" style="display:none" onchange="pickPhoto(this)"><button class="alt" onclick="document.getElementById(\'ph\').click()">Prendre ou choisir une photo</button>';
  if(S.photo)h+='<button class="alt" onclick="S.photo=\'\';savePs();render()">Retirer ma photo</button>';
  return h}
function pickPhoto(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){
    var s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2,out="";
    [[56,.6],[48,.6],[40,.5],[32,.5]].some(function(c){var cv=document.createElement("canvas");cv.width=cv.height=c[0];cv.getContext("2d").drawImage(im,sx,sy,s,s,0,0,c[0],c[0]);out=cv.toDataURL("image/jpeg",c[1]);return out.length<=4000});
    URL.revokeObjectURL(u);
    if(out.length>4000||out.indexOf("data:image/jpeg")!=0){S.err="Photo trop lourde, essaie-en une autre."}
    else{S.err="";S.photo=out}
    savePs();render()};
  im.onerror=function(){S.err="Impossible de lire cette photo.";render()};
  im.src=u}
function genCode(){var c="abcdefghjkmnpqrstuvwxyz23456789",s="";for(var i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function sid(i){return String(i).replace(/[^\w-]/g,"")}
function who(p){return avHtml(p.av,PH[p.id])+esc(p.name)}
function cleanPh(p){return typeof p=="string"&&p.length<5000&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(p)?p:""}

/* --- côté hôte : c’est lui l’arbitre, chaque joueur ne reçoit que sa propre vue --- */
function mkH(){return{phase:"lobby",cfg:{nu:1,white:true},P:{},order:[],rk:0,vs:0,round:0,start:null,out:null,outRole:"",msg:"",win:null,guessed:false,cw:"",uw:""}}
function hAlive(){return H.order.filter(function(id){return H.P[id]&&!H.P[id].dead})}
function viewFor(id){
  var Ps=H.P,lobby=H.phase=="lobby";
  var ids=lobby?Object.keys(Ps):H.order.filter(function(i){return Ps[i]}).concat(Object.keys(Ps).filter(function(i){return H.order.indexOf(i)<0}));
  var me=Ps[id];
  var v={t:"state",phase:H.phase,cfg:H.cfg,round:H.round,start:H.start,out:H.out,outRole:H.outRole,msg:H.msg,win:H.win,guessed:H.guessed,hostId:"host",me:id,
    players:ids.map(function(i){var p=Ps[i];return{id:i,name:p.name,av:p.av,spec:!lobby&&H.order.indexOf(i)<0,dead:p.dead||"",seen:!!p.seen,hasClue:p.cr===H.rk,clue:p.cr===H.rk?p.clue:"",voted:p.vs===H.vs&&!!p.vote}})};
  if(me&&H.order.indexOf(id)>=0&&me.role)v.my={role:me.role,word:me.word};
  v.myVote=me&&me.vs===H.vs?me.vote:"";
  if(H.phase=="end"){v.cw=H.cw;v.uw=H.uw;v.roles={};H.order.forEach(function(i){if(Ps[i])v.roles[i]=Ps[i].role})}
  return v}
function broadcast(){
  Object.keys(H.P).forEach(function(id){var p=H.P[id],v=viewFor(id);if(id=="host")O.v=v;else if(p.conn&&p.conn.open)p.conn.send(v)});
  refresh()}
function hostHandle(id,m){
  var p=H.P[id];if(!p||!m)return;var err="";
  if(m.t=="seen"&&H.phase=="play")p.seen=true;
  else if(m.t=="clue"&&H.phase=="play"&&H.order.indexOf(id)>=0&&!p.dead){
    var v=String(m.v||"").trim().slice(0,24);
    if(!v)return;
    if(p.word&&norm(v)==norm(p.word))err="Pas ton mot exact : trouve-en un qui s’en rapproche.";
    else{p.clue=v;p.cr=H.rk}}
  else if(m.t=="vote"&&H.phase=="play"){
    var a=hAlive();
    if(a.indexOf(id)>=0&&a.every(function(i){return H.P[i].cr===H.rk})&&a.indexOf(m.to)>=0&&m.to!=id){p.vote=m.to;p.vs=H.vs}}
  else if(m.t=="guess"&&H.phase=="out"&&H.out==id&&H.outRole=="w"&&!H.guessed){
    var g=String(m.v||"").trim().slice(0,40);
    if(g){H.guessed=true;if(norm(g)==norm(H.cw)){H.win="w";H.phase="end"}else H.msg="Raté ! Mr White n’a pas trouvé le mot."}}
  hostTick();broadcast();
  if(err){if(id=="host"){O.cerr=err;render()}else if(p.conn&&p.conn.open)p.conn.send({t:"err",m:err})}}
function hostTick(){
  if(H.phase=="play"){
    var a=hAlive();
    if(a.length&&a.every(function(i){var q=H.P[i];return q.vs===H.vs&&q.vote&&a.indexOf(q.vote)>=0})){
      var votes={},max=0,top=[];
      a.forEach(function(i){var t=H.P[i].vote;votes[t]=(votes[t]||0)+1});
      Object.keys(votes).forEach(function(k){if(votes[k]>max){max=votes[k];top=[k]}else if(votes[k]==max)top.push(k)});
      H.vs++;
      if(top.length>1)H.msg="Égalité, revotez !";
      else{var o=top[0];H.out=o;H.outRole=H.P[o].role;H.P[o].dead=H.P[o].role;H.guessed=false;H.msg="";H.phase="out"}}
  }else if(H.phase=="out"&&!H.guessed&&H.outRole=="w"&&!H.P[H.out])H.guessed=true}
function hcfg(k,d){H.cfg[k]=Math.max(1,Math.min(4,H.cfg[k]+d));broadcast()}
function hstart(){
  var ids=Object.keys(H.P),n=ids.length,imp=H.cfg.nu+(H.cfg.white?1:0);
  if(n<3){O.err="Il faut au moins 3 joueurs.";render();return}
  if(n-imp<=imp){O.err="Trop d’imposteurs pour "+n+" joueurs.";render();return}
  O.err="";
  var pair=shuf(PAIRS)[0],sw=Math.random()<.5,i;
  H.cw=sw?pair[1]:pair[0];H.uw=sw?pair[0]:pair[1];
  var roles=[];for(i=0;i<n;i++)roles.push("c");
  for(i=0;i<H.cfg.nu;i++)roles[i]="u";if(H.cfg.white)roles[H.cfg.nu]="w";
  roles=shuf(roles);H.order=shuf(ids);
  H.order.forEach(function(id,i){var p=H.P[id],r=roles[i];p.role=r;p.word=r=="c"?H.cw:r=="u"?H.uw:"";p.dead="";p.clue="";p.cr=-1;p.seen=false;p.vote="";p.vs=-1});
  H.out=null;H.msg="";H.win=null;H.guessed=false;H.round=1;H.rk++;H.vs++;
  H.start=shuf(H.order.filter(function(id){return H.P[id].role!="w"}))[0];
  H.phase="play";O.show=false;broadcast()}
function hcont(){
  var a=hAlive(),c=a.filter(function(i){return H.P[i].role=="c"}).length,im=a.length-c;
  if(im==0){H.win="c";H.phase="end"}else if(c<=im){H.win="i";H.phase="end"}
  else{H.round++;H.rk++;H.vs++;H.msg="";H.out=null;H.start=shuf(a.filter(function(i){return H.P[i].role!="w"}))[0];H.phase="play"}
  broadcast()}
function hreplay(){H.phase="lobby";H.order=[];H.win=null;H.out=null;H.msg="";H.vs++;broadcast()}
function addPlayer(c,m){
  if(Object.keys(H.P).length>=12){c.send({t:"full"});setTimeout(function(){c.close()},400);return}
  var id=c.peer,ph=cleanPh(m.ph);
  H.P[id]={name:String(m.name||"Joueur").slice(0,16),av:String(m.av||"🙂").slice(0,8),conn:c};
  c.pid=id;
  if(ph){PH[id]=ph;Object.keys(H.P).forEach(function(i){var q=H.P[i];if(i!=id&&q.conn&&q.conn.open)q.conn.send({t:"ph",id:id,ph:ph})})}
  c.send({t:"phs",m:PH});
  broadcast()}
function removePlayer(id){if(!H||!id||!H.P[id])return;delete H.P[id];delete PH[id];hostTick();broadcast()}

/* --- connexion --- */
async function enter(code,host){
  var pseudo=(S.pseudo||"").trim().slice(0,16);
  if(!pseudo){S.err="Choisis un pseudo d’abord.";render();return}
  if(!host&&code.length!=4){S.err="Le code a 4 caractères.";render();return}
  S.err="";S.busy=true;render();
  O={code:code,host:host,show:false,err:"",cerr:"",v:null,lost:false,peer:null,conn:null};
  if(host)startHost(pseudo,0);else startGuest(pseudo,code)}
function fail(msg){if(O&&O.peer){try{O.peer.destroy()}catch(e){}}O=null;H=null;S.busy=false;S.err=msg;go("menu")}
function startHost(pseudo,tries){
  var peer=new Peer(PFX+O.code);O.peer=peer;
  peer.on("open",function(){H=mkH();H.P.host={name:pseudo,av:S.av,conn:null};if(S.photo)PH.host=S.photo;S.busy=false;broadcast();go("o")});
  peer.on("connection",function(c){
    c.on("data",function(m){if(m&&m.t=="join"&&!c.pid)addPlayer(c,m);else if(c.pid)hostHandle(c.pid,m)});
    c.on("close",function(){removePlayer(c.pid)})});
  peer.on("error",function(e){
    if(e.type=="unavailable-id"&&tries<5){try{peer.destroy()}catch(x){}O.code=genCode();startHost(pseudo,tries+1)}
    else if(!H)fail("Impossible de créer la partie ("+e.type+").")})}
function startGuest(pseudo,code){
  var peer=new Peer(),done=false;O.peer=peer;
  var to=setTimeout(function(){if(!done)fail("Aucune partie avec le code "+code.toUpperCase()+".")},10000);
  peer.on("open",function(){
    var c=peer.connect(PFX+code,{reliable:true});O.conn=c;
    c.on("open",function(){done=true;clearTimeout(to);c.send({t:"join",name:pseudo,av:S.av,ph:S.photo||""})});
    c.on("data",onGuest);
    c.on("close",function(){if(O){O.lost=true;if(S.screen=="o")render()}})});
  peer.on("error",function(e){
    if(done)return;clearTimeout(to);
    fail(e.type=="peer-unavailable"?"Aucune partie avec le code "+code.toUpperCase()+".":"Connexion impossible ("+e.type+").")})}
function onGuest(m){
  if(!m||!O)return;
  if(m.t=="state"){var first=!O.v;O.v=m;if(first){S.busy=false;go("o")}else refresh()}
  else if(m.t=="phs"&&m.m){for(var k in m.m)if(/^[\w-]{1,40}$/.test(k)&&k!="__proto__")PH[k]=m.m[k];refresh()}
  else if(m.t=="ph"&&/^[\w-]{1,40}$/.test(m.id)){PH[m.id]=m.ph;refresh()}
  else if(m.t=="err"){O.cerr=String(m.m||"");render()}
  else if(m.t=="full")fail("La partie est pleine (12 joueurs maximum).")}
function refresh(){if(S.screen!="o"||!O)return;var a=document.activeElement;if(a&&(a.id=="g"||a.id=="cl"))return;render()}
function act(m){if(!O)return;if(O.host)hostHandle("host",m);else if(O.conn&&O.conn.open)O.conn.send(m)}
function leave(){if(!O)return;try{if(O.conn)O.conn.close();if(O.peer)O.peer.destroy()}catch(e){}O=null;H=null;PH={};go("menu")}
function seeWord(){O.show=false;act({t:"seen"})}
function sendClue(){var el=document.getElementById("cl"),v=el?el.value.trim().slice(0,24):"";if(!v)return;O.cerr="";act({t:"clue",v:v})}
function voteFor(id){act({t:"vote",to:id})}
function sendGuess(){var el=document.getElementById("g"),v=el?el.value.trim().slice(0,40):"";if(v)act({t:"guess",v:v})}

function rO(){
  var v=O.v,top='<div class="row"><span class="tag">Code '+esc(O.code.toUpperCase())+'</span><button class="alt" style="width:auto;margin:0;padding:8px 14px" onclick="leave()">Quitter</button></div>';
  if(O.lost)return top+'<h2>Connexion perdue</h2><p class="mute">L’hôte a quitté la partie ou le réseau a coupé. Reviens au menu pour en relancer une.</p>';
  if(!v)return top+'<p class="mute">Connexion à la partie…</p>';
  var me=v.me,isH=O.host,pm={},h=top,P=v.players;
  P.forEach(function(p){pm[p.id]=p});
  var mp=pm[me]||{};
  if(v.phase=="lobby"){
    h+='<h2>Salle d’attente</h2><div class="card"><p class="mute" style="text-align:center">Code à donner à tes amis</p><div class="room">'+esc(O.code.toUpperCase())+'</div></div><div class="card"><h2>Joueurs ('+P.length+')</h2>';
    P.forEach(function(p){h+='<div class="pl"><span>'+who(p)+(p.id==me?" (toi)":"")+'</span>'+(p.id==v.hostId?'<span class="tag">Hôte</span>':'')+'</div>'});
    h+='</div>';
    if(isH)h+='<div class="card"><div class="row"><span>Undercovers</span><span class="step"><button class="alt" onclick="hcfg(\'nu\',-1)" aria-label="Moins d’undercovers">−</button><b>'+v.cfg.nu+'</b><button class="alt" onclick="hcfg(\'nu\',1)" aria-label="Plus d’undercovers">+</button></span></div><div class="row"><label for="w">Ajouter Mr White</label><input type="checkbox" id="w" '+(v.cfg.white?"checked":"")+' onchange="H.cfg.white=this.checked;broadcast()"></div></div><p class="err">'+esc(O.err)+'</p><button class="red" onclick="hstart()">Lancer la partie</button>';
    else h+='<p class="mute" style="text-align:center">En attente du lancement par l’hôte…</p>';
    return h}
  if(v.phase=="play"){
    var my=v.my,dead=mp.dead,pls=P.filter(function(p){return !p.spec}),missing=pls.filter(function(p){return !p.dead&&!p.hasClue});
    h+='<h2>Tour '+v.round+'</h2><div class="card">';
    if(!my)h+='<p>Tu as rejoint en cours de partie : regarde la manche, tu joueras la prochaine.</p>';
    else if(dead)h+='<p>Tu es éliminé. Tu peux continuer à suivre la partie.</p>';
    else{
      var w=my.role=="w"?"Aucun mot (Mr White)":my.word;
      if(!mp.seen)h+='<p class="mute" style="text-align:center">Découvre ton mot, en secret</p><div class="word">'+esc(w)+'</div>'+(my.role=="w"?'<p class="mute" style="text-align:center">Écoute bien les autres et bluffe.</p>':'')+'<button class="red" onclick="seeWord()">J’ai retenu mon mot</button>';
      else{
        h+='<p class="mute">Ton mot</p><div class="word">'+(O.show?esc(w):"• • • •")+'</div><button class="alt" onclick="O.show=!O.show;render()">'+(O.show?"Cacher mon mot":"Voir mon mot")+'</button>';
        if(mp.hasClue)h+='<p style="margin-top:14px">Ton mot envoyé : <b>'+esc(mp.clue)+'</b></p>';
        else h+='<p style="margin:14px 0 4px"><b>Écris un mot qui se rapproche du tien</b></p><input type="text" id="cl" maxlength="24" placeholder="Un seul mot" aria-label="Ton mot indice"><p class="err">'+esc(O.cerr||"")+'</p><button class="red" onclick="sendClue()">Envoyer mon mot</button>'}}
    h+='</div><div class="card"><p>Chacun écrit <b>un seul mot</b> lié à son mot. <b>'+(pm[v.start]?esc(pm[v.start].name):"?")+'</b> commence.</p>'+(v.msg?'<p class="err">'+esc(v.msg)+'</p>':'')+(missing.length?'<p class="mute">En attente des mots de : '+missing.map(function(p){return esc(p.name)}).join(", ")+'</p>':'<p class="mute">Tous les mots sont là : votez pour le joueur à éliminer.</p>');
    var canV=my&&!dead&&!missing.length;
    pls.forEach(function(p){
      h+='<div class="pl '+(p.dead?"dead":"")+'"><span>'+who(p)+(p.id==me?" (toi)":"")+(p.hasClue&&p.clue?'<br><small class="mute">« '+esc(p.clue)+' »</small>':'')+'</span>';
      if(p.dead)h+='<span class="tag '+sid(p.dead)+'">'+lbl(p.dead)+'</span>';
      else{h+='<span>'+(p.voted?'<span class="tag">a voté</span> ':'');if(canV&&p.id!=me)h+='<button class="'+(v.myVote==p.id?"red":"alt")+'" onclick="voteFor(\''+sid(p.id)+'\')">'+(v.myVote==p.id?"Voté ✓":"Voter")+'</button>';h+='</span>'}
      h+='</div>'});
    return h+'</div>'}
  if(v.phase=="out"){
    var r=sid(v.outRole),op=pm[v.out],wait=r=="w"&&!v.guessed;
    h+='<h2>'+(op?esc(op.name):"Un joueur")+' est éliminé</h2><div class="card">'+(op?avHtml(op.av,PH[op.id],"xl"):"")+'<div class="big">'+(r=="c"?"🙂":r=="u"?"🕵️":"👻")+'</div><p style="text-align:center">C’était un <span class="tag '+r+'">'+lbl(r)+'</span></p>';
    if(wait&&v.out==me)h+='<p>Dernière chance ! Quel est le mot des civils ?</p><input type="text" id="g" aria-label="Mot des civils"><button class="red" onclick="sendGuess()">Valider</button>';
    else if(wait)h+='<p class="mute" style="text-align:center">Mr White tente de deviner le mot…</p>';
    if(v.msg)h+='<p class="err" style="text-align:center">'+esc(v.msg)+'</p>';
    h+='</div>';
    if(isH)h+='<button '+(wait?"disabled":"")+' onclick="hcont()">Continuer</button>';
    else if(!wait)h+='<p class="mute" style="text-align:center">L’hôte lance la suite…</p>';
    return h}
  h+='<div class="big">'+(v.win=="c"?"🎉":"😈")+'</div><h1 style="text-align:center">'+winTxt(v.win)+'</h1><div class="card"><p>Mot des civils : <b>'+esc(v.cw||"")+'</b></p><p>Mot de l’undercover : <b>'+esc(v.uw||"")+'</b></p>';
  P.filter(function(p){return !p.spec}).forEach(function(p){var r=v.roles&&sid(v.roles[p.id]||"");if(r)h+='<div class="pl"><span>'+who(p)+'</span><span class="tag '+r+'">'+lbl(r)+'</span></div>'});
  h+='</div>';
  if(isH)h+='<button class="red" onclick="hreplay()">Rejouer</button>';
  else h+='<p class="mute" style="text-align:center">L’hôte peut relancer une partie.</p>';
  return h}

RM=typeof Peer!=="undefined";
render();
</script>
